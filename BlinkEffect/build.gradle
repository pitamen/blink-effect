plugins {
    alias(libs.plugins.android.library)
    alias(libs.plugins.kotlin.android)
    id 'maven-publish'
}

def githubProperties = new Properties()
def githubPropertiesFile = rootProject.file("github.properties")

if (githubPropertiesFile.exists()) {
    githubPropertiesFile.withInputStream { githubProperties.load(it) }
}

android {
    namespace 'com.dishhome.blinkeffect'
    compileSdk 34

    defaultConfig {
        minSdk 24

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
}

publishing {
    publications{
        release(MavenPublication){
            afterEvaluate {
                println('test')
                from components["release"] // Use release variant explicitly after evaluation
            }
            groupId='com.github.pitamen'
            artifactId='blink-effect'
            version='1.0.2'
        }
    }
    repositories {
        maven {
            name = "GitHubPackages"
            url = uri("https://maven.pkg.github.com/pitamen/blink-effect")
            credentials {
                username = githubProperties["gpr.user"]
                password = githubProperties["gpr.key"]
            }
        }
    }
}

dependencies {

    implementation libs.androidx.core.ktx
    implementation libs.androidx.appcompat
    implementation libs.material
    testImplementation libs.junit
    androidTestImplementation libs.androidx.junit
    androidTestImplementation libs.androidx.espresso.core
}